name: Workload Modeling Demo

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  workload-modeling:
    name: Compare Workload Models
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Start FastAPI application
        run: |
          uvicorn app.main:app --host 127.0.0.1 --port 8000 > /tmp/app.log 2>&1 &

          for i in {1..20}; do
            if curl --silent --fail http://127.0.0.1:8000/api/search > /dev/null; then
              echo "API is ready"
              exit 0
            fi
            sleep 1
          done

          cat /tmp/app.log
          echo "API failed to start"
          exit 1

      - name: Run functional tests
        run: python -m pytest -q

      - name: Install k6
        uses: grafana/setup-k6-action@v1

      - name: Run naive workload
        run: |
          k6 run \
            --summary-export=performance/naive-summary.json \
            performance/workload-naive.js

      - name: Run calculated workload
        run: |
          k6 run \
            --summary-export=performance/modeled-summary.json \
            performance/workload-modeled.js

      - name: Generate workload comparison report
        run: |
          python performance/generate_workload_report.py

      - name: Upload workload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: workload-comparison-report
          path: |
            performance/workload-report.html
            performance/naive-summary.json
            performance/modeled-summary.json
          if-no-files-found: warn
          retention-days: 14